<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Услуги — Медицинский центр «Здоровье»</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }
    .service-card {
      background: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .price {
      font-size: 32px;
      font-weight: 700;
      color: #0ea5e9;
      margin: 12px 0;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo"><span class="logo-icon">🩺</span> Здоровье</div>
      <div class="nav-links">
        <a href="index.html">Главная</a>
        <a href="services.html">Услуги</a>
        <a href="about.html">О нас</a>
        <a href="doctors.html">Врачи</a>
        <a href="reviews.html">Отзывы</a>
      </div>
      <a href="#appointment" class="btn-primary">Записаться</a>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h1>Услуги и цены</h1>
      <div class="services-grid">
        <div class="service-card">
          <h3>Консультация терапевта</h3>
          <p class="price">3 500 ₽</p>
          <p>Первичный и повторный приём, осмотр, назначение лечения</p>
        </div>
        <div class="service-card">
          <h3>УЗИ органов брюшной полости</h3>
          <p class="price">2 800 ₽</p>
        </div>
        <div class="service-card">
          <h3>ЭКГ с расшифровкой</h3>
          <p class="price">1 500 ₽</p>
        </div>
        <div class="service-card">
          <h3>Общий анализ крови + СОЭ</h3>
          <p class="price">950 ₽</p>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
