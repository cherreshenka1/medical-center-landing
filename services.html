<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Услуги — Медицинский центр «Здоровье»</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <nav class="navbar"> <!-- тот же код навигации, что выше --> </nav>

  <section class="section">
    <div class="container">
      <h1>Наши услуги и цены</h1>
      <div class="services-grid">
        <div class="service-card">
          <h3>Консультация терапевта</h3>
          <p class="price">3 500 ₽</p>
          <p>Первичный приём, осмотр, назначение лечения</p>
        </div>
        <div class="service-card">
          <h3>УЗИ органов брюшной полости</h3>
          <p class="price">2 800 ₽</p>
        </div>
        <div class="service-card">
          <h3>ЭКГ с расшифровкой</h3>
          <p class="price">1 500 ₽</p>
        </div>
        <div class="service-card">
          <h3>Общий анализ крови</h3>
          <p class="price">800 ₽</p>
        </div>
        <div class="service-card">
          <h3>Консультация кардиолога</h3>
          <p class="price">4 200 ₽</p>
        </div>
        <div class="service-card">
          <h3>МРТ головного мозга</h3>
          <p class="price">7 500 ₽</p>
        </div>
      </div>

      <div id="appointment" class="appointment-form">
        <h2>Записаться на приём</h2>
        <form onsubmit="event.preventDefault(); alert('Заявка отправлена! Спасибо!');">
          <input type="text" placeholder="Ваше имя" required>
          <input type="tel" placeholder="Телефон" required>
          <button type="submit" class="btn-primary">Отправить заявку</button>
        </form>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
