<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Врачи — Медицинский центр «Здоровье»</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <nav class="navbar"> <!-- тот же код навигации --> </nav>

  <section class="section">
    <div class="container">
      <h1>Наши врачи</h1>
      <div class="doctors-grid">
        <div class="doctor-card">
          <div class="doctor-photo-frame"><span class="placeholder">🩺</span></div>
          <h3>Анна Смирнова</h3>
          <p class="specialty">Терапевт • 12 лет опыта</p>
        </div>
        <div class="doctor-card">
          <div class="doctor-photo-frame"><span class="placeholder">🫀</span></div>
          <h3>Дмитрий Ковалёв</h3>
          <p class="specialty">Кардиолог • 15 лет опыта</p>
        </div>
        <div class="doctor-card">
          <div class="doctor-photo-frame"><span class="placeholder">🧠</span></div>
          <h3>Екатерина Морозова</h3>
          <p class="specialty">Невролог • 9 лет опыта</p>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
