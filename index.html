<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медицинский центр «Здоровье»</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">🩺</span>
        <h1>Здоровье</h1>
      </div>
      <div class="nav-links">
        <a href="#services">Услуги</a>
        <a href="#about">О нас</a>
        <a href="#doctors">Врачи</a>
        <a href="#reviews">Отзывы</a>
      </div>
      <a href="#appointment" class="btn-primary">Записаться</a>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="container grid">
      <div class="hero-content">
        <h1>Ваше здоровье в надёжных руках</h1>
        <p class="hero-subtitle">Современный медицинский центр в Казани. Квалифицированные специалисты и новейшее оборудование.</p>
        <div class="hero-buttons">
          <a href="#appointment" class="btn-primary btn-large">Записаться на приём</a>
          <a href="#services" class="btn-secondary">Узнать больше</a>
        </div>
      </div>
      <div class="hero-image">
        <img src="https://picsum.photos/id/1015/800/900" alt="Врач">
      </div>
    </div>
  </header>

  <!-- Остальные секции будут в CSS и JS -->

  <script src="js/script.js"></script>
</body>
</html>
